<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">The four ways to connect</title>
  <desc id="d">A viewer reaches a host in one of four ways. By ID, the person at the host accepts. With the host's password and a code from its authenticator app, both checked by the host. From a device of the same account, when the host allows it and the account has two-factor authentication. Or as a member of an organisation, when the organisation's signed policy allows it. Each way is checked by the host itself.</desc>
  <style>
    text { font-family: Geist, Inter, "Segoe UI", system-ui, sans-serif; }
    /* One 12 s cycle; each lane has its 3 s turn. */
    .lane { opacity: .45; animation: lane 12s infinite; }
    .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; } .l4 { animation-delay: 9s; }
    @keyframes lane { 0%, 25% { opacity: 1; } 27%, 100% { opacity: .45; } }
    .dot { opacity: 0; animation: travel 12s infinite; }
    .dot.l1 { offset-path: path("M238 84 H700"); }
    .dot.l2 { offset-path: path("M238 168 H700"); }
    .dot.l3 { offset-path: path("M238 252 H700"); }
    .dot.l4 { offset-path: path("M238 336 H700"); }
    @keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 2% { opacity: 1; } 12% { offset-distance: 100%; opacity: 1; } 14%, 100% { offset-distance: 100%; opacity: 0; } }
    .ok { opacity: 0; animation: ok 12s infinite; }
    @keyframes ok { 0%, 12% { opacity: 0; } 14%, 24% { opacity: 1; } 26%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .lane { animation: none; opacity: 1; }
      .dot { animation: none; opacity: 0; }
      .ok { animation: none; opacity: 1; }
    }
  </style>

  <!-- Viewer and host -->
  <rect x="40" y="40" width="150" height="330" rx="14" fill="#16181d" stroke="#2a2e36"/>
  <text x="115" y="198" font-size="15" font-weight="600" fill="#d9dde3" text-anchor="middle">Viewer</text>
  <text x="115" y="217" font-size="11.5" fill="#8a919c" text-anchor="middle">wants in</text>
  <rect x="770" y="40" width="150" height="330" rx="14" fill="#16181d" stroke="#2a2e36"/>
  <text x="845" y="198" font-size="15" font-weight="600" fill="#d9dde3" text-anchor="middle">Host</text>
  <text x="845" y="217" font-size="11.5" fill="#8a919c" text-anchor="middle">decides itself</text>

  <!-- 1: by ID -->
  <g class="lane l1">
    <path d="M190 84 H770" stroke="#22252c" stroke-width="3"/>
    <rect x="238" y="62" width="200" height="44" rx="11" fill="#14161b" stroke="#2a2e36"/>
    <text x="256" y="81" font-size="13" font-weight="600" fill="#d9dde3">1 · By ID</text>
    <text x="256" y="97" font-size="11" fill="#8a919c">anyone, no account needed</text>
    <rect x="520" y="66" width="170" height="36" rx="10" fill="#14161b" stroke="#2a2e36"/>
    <text x="605" y="89" font-size="12" fill="#c3c8d0" text-anchor="middle">someone there accepts</text>
  </g>
  <!-- 2: password + code -->
  <g class="lane l2">
    <path d="M190 168 H770" stroke="#22252c" stroke-width="3"/>
    <rect x="238" y="146" width="200" height="44" rx="11" fill="#14161b" stroke="#2a2e36"/>
    <text x="256" y="165" font-size="13" font-weight="600" fill="#d9dde3">2 · Password + code</text>
    <text x="256" y="181" font-size="11" fill="#8a919c">set up on the host</text>
    <rect x="520" y="150" width="170" height="36" rx="10" fill="#14161b" stroke="#2a2e36"/>
    <text x="605" y="173" font-size="12" fill="#c3c8d0" text-anchor="middle">both checked by the host</text>
  </g>
  <!-- 3: same account -->
  <g class="lane l3">
    <path d="M190 252 H770" stroke="#22252c" stroke-width="3"/>
    <rect x="238" y="230" width="200" height="44" rx="11" fill="#14161b" stroke="#2a2e36"/>
    <text x="256" y="249" font-size="13" font-weight="600" fill="#d9dde3">3 · Same account</text>
    <text x="256" y="265" font-size="11" fill="#8a919c">your own devices</text>
    <rect x="520" y="234" width="170" height="36" rx="10" fill="#14161b" stroke="#2a2e36"/>
    <text x="605" y="257" font-size="12" fill="#c3c8d0" text-anchor="middle">switched on · with 2FA</text>
  </g>
  <!-- 4: organisation -->
  <g class="lane l4">
    <path d="M190 336 H770" stroke="#22252c" stroke-width="3"/>
    <rect x="238" y="314" width="200" height="44" rx="11" fill="#14161b" stroke="#2a2e36"/>
    <text x="256" y="333" font-size="13" font-weight="600" fill="#d9dde3">4 · Organisation</text>
    <text x="256" y="349" font-size="11" fill="#8a919c">members, enrolled machines</text>
    <rect x="520" y="318" width="170" height="36" rx="10" fill="#14161b" stroke="#2a2e36"/>
    <text x="605" y="341" font-size="12" fill="#c3c8d0" text-anchor="middle">the signed policy allows</text>
  </g>

  <!-- What travels, and the host's yes -->
  <circle class="dot l1" r="5" fill="#7dd3c0"/>
  <circle class="dot l2" r="5" fill="#7dd3c0" style="animation-delay: 3s"/>
  <circle class="dot l3" r="5" fill="#7dd3c0" style="animation-delay: 6s"/>
  <circle class="dot l4" r="5" fill="#7dd3c0" style="animation-delay: 9s"/>
  <g font-size="13" font-weight="600" fill="#7dd3c0">
    <text class="ok" x="712" y="89">✓</text>
    <text class="ok" x="712" y="173" style="animation-delay: 3s">✓</text>
    <text class="ok" x="712" y="257" style="animation-delay: 6s">✓</text>
    <text class="ok" x="712" y="341" style="animation-delay: 9s">✓</text>
  </g>

  <text x="480" y="24" font-size="12" fill="#8a919c" text-anchor="middle">Every way is checked by the host. The server only connects the two, through an end-to-end encrypted session.</text>
</svg>
