<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="t d">
  <title id="t">How an organisation's policy reaches its machines</title>
  <desc id="d">An admin signs the organisation's policy with the organisation key, which only admins can unlock. The server stores and hands out the signed policy, but cannot sign one itself. An enrolled machine checks the signature against the organisation key from its enrollment key, then lets in only the members the rules allow. A policy the server altered fails the check and is ignored.</desc>
  <style>
    text { font-family: Geist, Inter, "Segoe UI", system-ui, sans-serif; }
    /* 10 s cycle: a signed policy travels (0-5 s), then a forged one (5-10 s). */
    .doc { opacity: 0; offset-path: path("M190 150 H770"); animation: doc 10s infinite; }
    .forged { offset-path: path("M480 150 H770"); animation-delay: 5s; }
    @keyframes doc { 0% { offset-distance: 0%; opacity: 0; } 4% { opacity: 1; } 34% { offset-distance: 100%; opacity: 1; } 46% { offset-distance: 100%; opacity: 1; } 50%, 100% { offset-distance: 100%; opacity: 0; } }
    .yes, .no { opacity: 0; animation: verdict 10s infinite; }
    .no { animation-delay: 5s; }
    @keyframes verdict { 0%, 32% { opacity: 0; } 35%, 47% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .doc { animation: none; opacity: 0; }
      .yes { animation: none; opacity: 1; }
      .no { animation: none; opacity: 0; }
    }
  </style>

  <!-- Admin -->
  <rect x="40" y="70" width="150" height="160" rx="14" fill="#16181d" stroke="#2a2e36"/>
  <text x="115" y="104" font-size="15" font-weight="600" fill="#d9dde3" text-anchor="middle">Admin</text>
  <text x="115" y="124" font-size="11.5" fill="#8a919c" text-anchor="middle">unlocks the org key</text>
  <text x="115" y="140" font-size="11.5" fill="#8a919c" text-anchor="middle">with their account</text>
  <rect x="62" y="166" width="106" height="40" rx="9" fill="#14161b" stroke="#2a2e36"/>
  <text x="115" y="184" font-size="11" fill="#c3c8d0" text-anchor="middle">members · groups</text>
  <text x="115" y="198" font-size="11" fill="#c3c8d0" text-anchor="middle">rules · workers</text>

  <!-- Server -->
  <rect x="405" y="70" width="150" height="160" rx="14" fill="#121418" stroke="#2a2e36" stroke-dasharray="5 5"/>
  <text x="480" y="104" font-size="15" font-weight="600" fill="#d9dde3" text-anchor="middle">Server</text>
  <text x="480" y="124" font-size="11.5" fill="#8a919c" text-anchor="middle">stores and hands out</text>
  <text x="480" y="140" font-size="11.5" fill="#8a919c" text-anchor="middle">the signed policy</text>
  <text x="480" y="196" font-size="11.5" fill="#8a919c" text-anchor="middle">has no key to sign</text>

  <!-- Machine -->
  <rect x="770" y="70" width="150" height="160" rx="14" fill="#16181d" stroke="#2a2e36"/>
  <text x="845" y="104" font-size="15" font-weight="600" fill="#d9dde3" text-anchor="middle">Enrolled machine</text>
  <text x="845" y="124" font-size="11.5" fill="#8a919c" text-anchor="middle">knows the org key</text>
  <text x="845" y="140" font-size="11.5" fill="#8a919c" text-anchor="middle">from its enrollment</text>

  <path d="M190 150 H405 M555 150 H770" stroke="#22252c" stroke-width="3"/>

  <!-- The policy, signed, then forged -->
  <g class="doc">
    <rect x="-22" y="-14" width="44" height="28" rx="6" fill="#14161b" stroke="#7dd3c0"/>
    <text x="0" y="5" font-size="12" fill="#7dd3c0" text-anchor="middle">✎ sig</text>
  </g>
  <g class="doc forged">
    <rect x="-22" y="-14" width="44" height="28" rx="6" fill="#14161b" stroke="#e5737a"/>
    <text x="0" y="5" font-size="12" fill="#e5737a" text-anchor="middle">+ eve</text>
  </g>

  <g class="yes">
    <rect x="770" y="246" width="150" height="54" rx="10" fill="#14161b" stroke="#7dd3c0" stroke-opacity=".6"/>
    <text x="845" y="268" font-size="12" font-weight="600" fill="#7dd3c0" text-anchor="middle">✓ signature checks</text>
    <text x="845" y="286" font-size="11" fill="#8a919c" text-anchor="middle">rules apply</text>
  </g>
  <g class="no">
    <rect x="770" y="246" width="150" height="54" rx="10" fill="#14161b" stroke="#e5737a" stroke-opacity=".6"/>
    <text x="845" y="268" font-size="12" font-weight="600" fill="#e5737a" text-anchor="middle">✗ not signed by the org</text>
    <text x="845" y="286" font-size="11" fill="#8a919c" text-anchor="middle">ignored, eve stays out</text>
  </g>

  <text x="480" y="330" font-size="12" fill="#8a919c" text-anchor="middle">Machines never go back to an older version, and a policy expires after 30 days unless an admin's app renews it.</text>
</svg>
