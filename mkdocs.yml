site_name: SomeDesk
site_description: Remote desktop you host yourself. End-to-end encrypted, zero-knowledge sign-in, written in Rust.
site_url: https://giosuel.github.io/somedesk/
repo_url: https://github.com/giosuel/somedesk
repo_name: giosuel/somedesk
edit_uri: edit/main/docs/
copyright: SomeDesk is free software under the AGPL-3.0-or-later.

# The README links into docs/ too; media for it lives in docs/media.
exclude_docs: |
  requirements.txt

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font:
    text: Geist
    code: Geist Mono
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/giosuel/somedesk
      name: SomeDesk on GitHub

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
      - Self-hosting: self-hosting.md
      - Platforms: platforms.md
  - How it works:
      - Architecture: architecture.md
      - Security model: security.md
  - Development: development.md
