# Server + PostgreSQL, with the published server image (x86-64 and ARM64):
#   SOMEDESK_DB_PASSWORD=change-me docker compose -f packaging/server/compose.yaml up -d
# (or `podman compose`). Clients connect to this host on UDP 21116.
# SOMEDESK_IMAGE picks another image: a version such as ghcr.io/giosuel/somedesk-server:0.1.0,
# :main for the latest code on main, or one you built (podman build -f packaging/server/Dockerfile).
# The server's data (its certificate, which clients pin) is on a named volume. With a bind mount
# instead, make the directory writable for the image's user first: the server runs as `somedesk`
# (UID and GID 999), not root: `sudo chown 999:999 ./data`, or with rootless podman
# `podman unshare chown 999:999 ./data`.
services:
  db:
    image: docker.io/library/postgres:17
    environment:
      POSTGRES_USER: somedesk
      POSTGRES_PASSWORD: ${SOMEDESK_DB_PASSWORD:?set SOMEDESK_DB_PASSWORD}
      POSTGRES_DB: somedesk
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "somedesk"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  server:
    image: ${SOMEDESK_IMAGE:-ghcr.io/giosuel/somedesk-server:latest}
    environment:
      # The password goes separately, so it may have characters a URL can't (@, /, :, %).
      DATABASE_URL: postgres://somedesk@db/somedesk
      PGPASSWORD: ${SOMEDESK_DB_PASSWORD}
    ports:
      - "21116:21116/udp"
    volumes:
      - server-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "somedesk-server", "check"]
      interval: 30s
      start_period: 10s
      retries: 3
    restart: unless-stopped
volumes:
  db:
  server-data:
