name: Release

# Pushing a tag like v0.4.0 builds every package and publishes them as a GitHub release, and the
# server image to ghcr.io. The tag is the version: Cargo.toml keeps the placeholder 0.0.0-dev, and
# every job writes the tag's version into its checkout first (scripts/set-version.sh). Release
# notes come from the tag message, so a release is:
#   git fetch origin && git tag -a v0.4.0 origin/main && git push origin v0.4.0
# (the editor opens for the notes: a first paragraph, then "- " lines for a list).
# Running it by hand (Actions › Release › Run workflow) is a dry run: everything is built and
# uploaded as workflow artifacts, but no image is pushed and no release is created.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Build caches: tag runs only restore them (a cache saved for a tag is only visible to that tag).
# linux starts from CI's packages job (shared-key linux-release), windows and macos from CI's
# jobs of the same name, which build the same release binaries. The AppImage and Android caches
# are saved by dry runs on main: run one before tagging.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for a dry run's version
      # A tag's version is the tag; a dry run's comes from the tags before it (0.4.1-dev.5+g…).
      - id: version
        name: Version and release notes
        run: |
          notes=""
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::$GITHUB_REF_NAME is not a version tag like v1.2.3 or v1.2.3-rc.1"
              exit 1
            fi
            # The checkout may have turned an annotated tag into a lightweight one.
            git fetch --force origin "+refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then
              notes=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME")
            fi
            if [ -z "$notes" ] && [[ "$version" != *-* ]] \
              && ! grep -q "<release version=\"$version\"" packaging/linux/ch.giosuel.SomeDesk.metainfo.xml; then
              echo "::warning::$GITHUB_REF_NAME has no message: the release has no notes of its own (tag with git tag -a)"
            fi
          else
            version=$(scripts/version.sh)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          { echo "notes<<END_OF_NOTES"; printf '%s\n' "$notes"; echo "END_OF_NOTES"; } >> "$GITHUB_OUTPUT"
          echo "Version $version"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
        run: scripts/set-version.sh "$VERSION"
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config clang libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libpipewire-0.3-dev libspa-0.2-dev
      - run: cargo install cargo-deb --locked
      - run: cargo build --release --locked -p somedesk-server -p somedesk-app
      - run: cargo deb --no-build -p somedesk-server && cargo deb --no-build -p somedesk-app
      - name: Binary archive
        run: |
          name="SomeDesk-${{ needs.version.outputs.version }}-linux-x64"
          mkdir -p "dist/$name"
          cp target/release/somedesk target/release/somedesk-agent target/release/somedesk-server README.md LICENSE "dist/$name/"
          strip "dist/$name/somedesk" "dist/$name/somedesk-agent" "dist/$name/somedesk-server"
          # Desktop file, metainfo and icon, at their paths in the repository (for somedesk-bin).
          mkdir -p "dist/$name/packaging/linux" "dist/$name/assets/brand"
          cp packaging/linux/ch.giosuel.SomeDesk.desktop packaging/linux/ch.giosuel.SomeDesk.metainfo.xml \
            "dist/$name/packaging/linux/"
          cp assets/brand/app-icon.svg "dist/$name/assets/brand/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cp target/debian/*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb

  appimage:
    needs: version
    runs-on: ubuntu-24.04
    # Built on Debian 12 (glibc 2.36, linking only symbols up to 2.35): the AppImage then runs on
    # Debian 12, Ubuntu 22.04 and later.
    container: debian:12
    steps:
      - name: Build tools and system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config \
            clang python3 file libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libx11-dev libpipewire-0.3-dev libspa-0.2-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: appimage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
        run: scripts/set-version.sh "$VERSION"
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/dist/*.AppImage

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
        run: scripts/set-version.sh "$VERSION"
      - name: Android SDK packages and cargo-ndk
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" >/dev/null
          cargo install cargo-ndk@4.1.2 --locked
      # Releases are signed with the app's own key, so phones accept them as updates. Add it as
      # the secrets ANDROID_KEYSTORE_BASE64 (base64 of the keystore file, key alias "somedesk")
      # and ANDROID_KEYSTORE_PASSWORD. Dry runs without it use a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SOMEDESK_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::the ANDROID_KEYSTORE_BASE64 secret is not set, so the APK cannot be signed for release"
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: this dry run signs the APK with a throwaway key"
          fi
      - name: Build the APK
        env:
          SOMEDESK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" packaging/android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: target/dist/*.apk

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
        run: scripts/set-version.sh "$VERSION"
      - run: cargo build --release --locked -p somedesk-app
      - name: Zip
        shell: pwsh
        run: |
          $name = "SomeDesk-${{ needs.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/somedesk.exe, target/release/somedesk-agent.exe, README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Set the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_NOTES: ${{ needs.version.outputs.notes }}
        run: scripts/set-version.sh "$VERSION"
      - run: packaging/macos/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/SomeDesk-*-macos.zip

  # The multi-arch server image (x86-64 and ARM64), pushed to ghcr.io for tags only, and only
  # once the release is out: `latest` must not run ahead of the apps. Otherwise (no tag, or a
  # failed build skipped the release) the image is only built.
  image:
    needs: [version, release]
    if: ${{ !cancelled() && needs.version.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.release.result) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
      push: ${{ needs.release.result == 'success' }}

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, appimage, android, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only the packages: the image job leaves digests and Docker build records behind too.
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{linux,appimage,android,windows,macos}"
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
        # The tag message, then GitHub's list of merged pull requests.
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "SomeDesk $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes $prerelease

  aur:
    name: AUR (${{ matrix.pkg }})
    # Stable releases only, after the GitHub release (and its tarball) exists.
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg: [somedesk, somedesk-bin]
    steps:
      - uses: actions/checkout@v4
      - name: Set pkgver
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            "packaging/aur/${{ matrix.pkg }}/PKGBUILD"
      # Builds the package (checksums refreshed, dependencies installed), then
      # pushes PKGBUILD and a fresh .SRCINFO to the AUR.
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: packaging/aur/${{ matrix.pkg }}/PKGBUILD
          updpkgsums: true
          test: true
          test_flags: --clean --cleanbuild --syncdeps --noconfirm
          commit_username: giosuel
          commit_email: me@giosuel.ch
          commit_message: Update to ${{ github.ref_name }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
