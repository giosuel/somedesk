name: Release

# Pushing a tag like v0.2.0 builds every package and publishes them as a GitHub release, and the
# server image to ghcr.io. The tag must match the workspace version in Cargo.toml.
# Running it by hand (Actions › Release › Run workflow) is a dry run: everything is built and
# uploaded as workflow artifacts, but no image is pushed and no release is created.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Build caches: tag runs only restore them (a cache saved for a tag is only visible to that tag).
# linux starts from CI's packages job (shared-key linux-release), windows and macos from CI's
# jobs of the same name, which build the same release binaries. The AppImage and Android caches
# are saved by dry runs on main: run one before tagging.

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Version (a tag must match Cargo.toml)
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          if ! grep -q "<release version=\"$version\"" packaging/linux/ch.giosuel.SomeDesk.metainfo.xml; then
            echo "::error::packaging/linux/ch.giosuel.SomeDesk.metainfo.xml has no <release> entry for $version"
            [ "$GITHUB_REF_TYPE" = tag ] && exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config clang libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libpipewire-0.3-dev libspa-0.2-dev
      - run: cargo install cargo-deb --locked
      - run: cargo build --release --locked -p somedesk-server -p somedesk-app
      - run: cargo deb --no-build -p somedesk-server && cargo deb --no-build -p somedesk-app
      - name: Binary archive
        run: |
          name="SomeDesk-${{ needs.version.outputs.version }}-linux-x64"
          mkdir -p "dist/$name"
          cp target/release/somedesk target/release/somedesk-agent target/release/somedesk-server README.md LICENSE "dist/$name/"
          strip "dist/$name/somedesk" "dist/$name/somedesk-agent" "dist/$name/somedesk-server"
          # Desktop file, metainfo and icon, at their paths in the repository (for somedesk-bin).
          mkdir -p "dist/$name/packaging/linux" "dist/$name/assets/brand"
          cp packaging/linux/ch.giosuel.SomeDesk.desktop packaging/linux/ch.giosuel.SomeDesk.metainfo.xml \
            "dist/$name/packaging/linux/"
          cp assets/brand/app-icon.svg "dist/$name/assets/brand/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          cp target/debian/*.deb dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb

  appimage:
    needs: version
    runs-on: ubuntu-24.04
    # Built on Debian 12 (glibc 2.36, linking only symbols up to 2.35): the AppImage then runs on
    # Debian 12, Ubuntu 22.04 and later.
    container: debian:12
    steps:
      - name: Build tools and system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git build-essential pkg-config \
            clang python3 file libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libx11-dev libpipewire-0.3-dev libspa-0.2-dev
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: appimage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/dist/*.AppImage

  android:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Android SDK packages and cargo-ndk
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" >/dev/null
          cargo install cargo-ndk@4.1.2 --locked
      # Releases are signed with the app's own key, so phones accept them as updates. Add it as
      # the secrets ANDROID_KEYSTORE_BASE64 (base64 of the keystore file, key alias "somedesk")
      # and ANDROID_KEYSTORE_PASSWORD. Dry runs without it use a throwaway debug key.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SOMEDESK_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::the ANDROID_KEYSTORE_BASE64 secret is not set, so the APK cannot be signed for release"
            exit 1
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: this dry run signs the APK with a throwaway key"
          fi
      - name: Build the APK
        env:
          SOMEDESK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" packaging/android/build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: target/dist/*.apk

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: cargo build --release --locked -p somedesk-app
      - name: Zip
        shell: pwsh
        run: |
          $name = "SomeDesk-${{ needs.version.outputs.version }}-windows-x64"
          New-Item -ItemType Directory -Path "dist/$name" | Out-Null
          Copy-Item target/release/somedesk.exe, target/release/somedesk-agent.exe, README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - run: packaging/macos/make-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/dist/SomeDesk-*-macos.zip

  # The multi-arch server image (x86-64 and ARM64), pushed to ghcr.io for tags only.
  image:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/server-image.yml
    with:
      version: ${{ needs.version.outputs.version }}
      push: ${{ github.ref_type == 'tag' }}

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, appimage, android, windows, macos, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "SomeDesk $VERSION" --generate-notes $prerelease

  aur:
    name: AUR (${{ matrix.pkg }})
    # Stable releases only, after the GitHub release (and its tarball) exists.
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pkg: [somedesk, somedesk-bin]
    steps:
      - uses: actions/checkout@v4
      - name: Set pkgver
        run: |
          sed -i -e "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" -e "s/^pkgrel=.*/pkgrel=1/" \
            "packaging/aur/${{ matrix.pkg }}/PKGBUILD"
      # Builds the package (checksums refreshed, dependencies installed), then
      # pushes PKGBUILD and a fresh .SRCINFO to the AUR.
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        with:
          pkgname: ${{ matrix.pkg }}
          pkgbuild: packaging/aur/${{ matrix.pkg }}/PKGBUILD
          updpkgsums: true
          test: true
          test_flags: --clean --cleanbuild --syncdeps --noconfirm
          commit_username: giosuel
          commit_email: me@giosuel.ch
          commit_message: Update to ${{ github.ref_name }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
