name: Server image

# Builds the server image for x86-64 and ARM64 and pushes it to ghcr.io/<owner>/somedesk-server:
#   - on every push to main that touches the server: `main` and `sha-<commit>`
#   - from the release workflow, for a v* tag: `<version>`, and `latest` unless it's a pre-release
# Each architecture builds natively on its own runner (no emulation); a last job joins the two
# into one multi-arch image.
on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - packaging/server/**
      - .github/workflows/server-image.yml
  workflow_call:
    inputs:
      version:
        description: Release version (the tag without the v)
        type: string
        required: true
      push:
        description: Push the image (false for a dry run)
        type: boolean
        required: true

permissions:
  contents: read

env:
  # On main pushes there are no inputs: always push.
  PUSH: ${{ inputs.version == '' || inputs.push }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Image name and version
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/somedesk-server" >> "$GITHUB_ENV"
          echo "VERSION=${{ inputs.version || format('main-{0}', github.sha) }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only, without a tag: the merge job tags the multi-arch image.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record isn't needed, and it's uploaded in a form other jobs can't download.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: packaging/server/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ env.PUSH }}
      # The image that was pushed, by its digest; a dry run's, built again into the local store.
      - name: Smoke test
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="$IMAGE@$DIGEST"
          if [ "$PUSH" != true ]; then
            docker buildx build -f packaging/server/Dockerfile --platform ${{ matrix.platform }} --load -t smoke .
            image=smoke
          fi
          docker run --rm "$image" --version
          docker run --rm "$image" check --help >/dev/null
      - name: Save the digest
        if: env.PUSH == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.PUSH == 'true'
        with:
          name: server-image-digest-${{ strategy.job-index }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1

  merge:
    needs: build
    if: ${{ inputs.version == '' || inputs.push }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: server-image-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the multi-arch image
        working-directory: ${{ runner.temp }}/digests
        env:
          VERSION: ${{ inputs.version }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/somedesk-server"
          if [ -n "$VERSION" ]; then
            tags=(-t "$image:$VERSION")
            # Pre-releases (v1.2.0-rc.1) don't move `latest`.
            [[ "$VERSION" == *-* ]] || tags+=(-t "$image:latest")
          else
            tags=(-t "$image:main" -t "$image:sha-${GITHUB_SHA::7}")
          fi
          sources=()
          for digest in *; do sources+=("$image@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[1]}"
