name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Only runs on main save their build caches; pull requests start from main's. (Each job's cache
# is 0.6-1.5 GB and a repository gets 10 GB, so caches saved for every branch evicted main's.)
env:
  CARGO_TERM_COLOR: always
  # Debug builds of the crypto and video crates are optimized anyway (see Cargo.toml).
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A failed run still saves what it compiled, so the next run doesn't start cold.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config clang libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libpipewire-0.3-dev libspa-0.2-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # The Android app: lints the code that only exists there (the APK is built on release).
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Android SDK packages and cargo-ndk
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null
          "$sdkmanager" --install "platforms;android-35" "ndk;28.2.13676358" >/dev/null
          cargo install cargo-ndk@4.1.2 --locked
      - name: Clippy
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          cargo ndk -t arm64-v8a -P 26 clippy --locked -p somedesk-android -- -D warnings

  test-linux:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SOMEDESK_TEST_DATABASE_URL: postgres://postgres:postgres@localhost/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A failed run still saves what it compiled, so the next run doesn't start cold.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libraries and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config clang libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libpipewire-0.3-dev libspa-0.2-dev \
            xvfb x11-utils x11-xserver-utils xsel postgresql-client sway
      # Unit tests, X11 backend tests on Xvfb, server and end-to-end tests. (The Wayland test runs
      # only where GNOME is installed; it is skipped here.)
      - run: scripts/test.sh
      # Real Linux NATs in network namespaces: direct connection vs. relay fallback.
      - run: scripts/nat-test.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A failed run still saves what it compiled, so the next run doesn't start cold.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests (without database or display)
        run: cargo test -p somedesk-proto -p somedesk-crypto -p somedesk-codec -p somedesk-platform -p somedesk-client -p somedesk-app
      - run: cargo build --release -p somedesk-app
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: somedesk-windows
          path: target/release/somedesk.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A failed run still saves what it compiled, so the next run doesn't start cold.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Tests (without database or display)
        run: cargo test -p somedesk-proto -p somedesk-crypto -p somedesk-codec -p somedesk-platform -p somedesk-client -p somedesk-app
      - run: packaging/macos/make-app.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: somedesk-macos
          path: target/dist/SomeDesk-*-macos.zip

  # Builds the release binaries exactly like the release workflow's linux job, which then starts
  # from this job's cache (shared-key).
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-release
          # A failed run still saves what it compiled, so the next run doesn't start cold.
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config clang libfontconfig1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libx11-dev libpipewire-0.3-dev libspa-0.2-dev
      - run: cargo install cargo-deb@3.8.0 --locked
      - run: cargo build --release --locked -p somedesk-server -p somedesk-app
      - run: cargo deb --no-build -p somedesk-server && cargo deb --no-build -p somedesk-app
      - run: docker build -f packaging/server/Dockerfile -t somedesk-server .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: somedesk-debs
          path: target/debian/*.deb
