[package]
name = "somedesk-platform"
description = "Screen capture, input injection and clipboard backends for SomeDesk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
# Cross-platform; on Linux it speaks both X11 selections and the Wayland data-control protocol.
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
enumflags2 = "0.7.12"
pipewire = "0.10.1"
tokio = { workspace = true }
x11rb = { version = "0.13", features = ["xtest"] }

[dev-dependencies]
tracing-subscriber.workspace = true
