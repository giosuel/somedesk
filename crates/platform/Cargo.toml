[package]
name = "somedesk-platform"
description = "Screen capture, input injection and clipboard backends for SomeDesk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true

# Cross-platform; on Linux it speaks both X11 selections and the Wayland data-control protocol.
[target.'cfg(not(target_os = "android"))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
enumflags2 = "0.7.12"
pipewire = "0.10.1"
tokio = { workspace = true }
x11rb = { version = "0.13", features = ["xtest", "randr"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["highsierra"] }

[dev-dependencies]
tracing-subscriber.workspace = true
